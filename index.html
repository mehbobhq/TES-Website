    <script>
      // Page specific meta configurations
      const metaData = {
        "/": {
          title: "TruckEase | Trucking Compliance & Back-Office for Owner-Operators",
          desc: "TruckEase helps owner-operators and small fleets across Canada and the US stay compliant, protect their operating authority, and run their back office without the chaos."
        },
        "/platform": {
          title: "Compliance Tracking Platform for Small Fleets | TruckEase",
          desc: "One dashboard for DOT status, document storage, renewal alerts, and maintenance records. Built for owner-operators and fleets up to 10 trucks."
        },
        "/services": {
          title: "Trucking Compliance Services — IFTA, IRP, DQ Files | TruckEase",
          desc: "Done-for-you IFTA filing, IRP registration, driver qualification management, and authority maintenance for small carriers across Canada and the US."
        },
        "/about": {
          title: "About TruckEase | Built for Owner-Operators Who Drive and Run the Business",
          desc: "TruckEase exists because small carriers face the same compliance burden as national fleets — without the team to manage it. We close that gap."
        },
        "/contact": {
          title: "Contact TruckEase | Direct Access to Compliance Specialists",
          desc: "Questions about IFTA, CVOR, DOT filings, or cross-border compliance? Reach TruckEase directly. Real person responds within 1 business day.",
          faq: {
            "@context": "https://schema.org",
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Do you work with single-truck operations?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Our tracking platform and managed services are built specifically for independent owner-operators and small fleets of 1 to 10 trucks."
                }
              },
              {
                "@type": "Question",
                "name": "Do your services cover both Canada and the United States?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. We handle compliance across FMCSA (DOT, MC) and Canadian provincial frameworks including NSC and CVOR, including cross-border requirements."
                }
              },
              {
                "@type": "Question",
                "name": "How fast do you respond?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "We review every message personally and respond within 1 business day."
                }
              }
            ]
          }
        },
        "/free-review": {
          title: "Free Fleet Compliance Review | TruckEase",
          desc: "Get a free review of your DOT, MC, NSC, or CVOR profile. We check your authority status, filing currency, and safety score — no commitment required."
        }
      };

      function updatePageMeta() {
        const path = window.location.pathname;
        const data = metaData[path] || metaData["/"];
        
        // Update Title, Meta Description, and Canonical URL link
        document.title = data.title;
        const descMeta = document.getElementById("meta-description");
        if (descMeta) descMeta.setAttribute("content", data.desc);
        const canonicalLink = document.getElementById("canonical-link");
        if (canonicalLink) canonicalLink.setAttribute("href", "https://truckeasesolutions.com" + path);
        
        // Handle Dynamic FAQ Injection
        const faqScript = document.getElementById("faq-schema");
        if (faqScript) {
          if (data.faq) {
            faqScript.textContent = JSON.stringify(data.faq);
          } else {
            faqScript.textContent = "";
          }
        }

        // Dynamically inject the Blog link into the footer if it's not already there
        injectBlogLink();
      }

     function injectBlogLink() {
        // Wait briefly for the framework script to draw the footer layout elements
        setTimeout(() => {
          if (document.getElementById("dynamic-blog-link")) return;

          // 1. Find all links inside the footer
          const footerLinks = document.querySelectorAll("footer a");
          let contactLink = null;

          // 2. Loop through them to find the exact "Contact" link
          for (const link of footerLinks) {
            if (link.textContent.trim() === "Contact") {
              contactLink = link;
              break;
            }
          }

          // 3. Insert the Blog link directly after the Contact link matching its design rules
          if (contactLink && contactLink.parentNode) {
            const blogLink = document.createElement("a");
            blogLink.id = "dynamic-blog-link";
            blogLink.href = "/blog";
            
            // Copies the exact Tailwind structural layout styles of your other menu links
            blogLink.className = "text-slate-400 hover:text-white transition text-sm block mt-2";
            blogLink.innerText = "Blog";

            // Places it beautifully directly below Contact
            contactLink.parentNode.insertBefore(blogLink, contactLink.nextSibling);
          }
        }, 400);
      }

      // Track URL Changes and Snap back to the Top Header
      let currentPath = window.location.pathname;
      updatePageMeta(); // Run once immediately on initial load
      
      setInterval(() => {
        if (currentPath !== window.location.pathname) {
          currentPath = window.location.pathname;
          window.scrollTo(0, 0);
          updatePageMeta(); // Update titles and SEO fields for the new view
        }
      }, 100);
    </script>
