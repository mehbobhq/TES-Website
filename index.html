  <body>
    <div id="root"></div>

    <script>
      // ─────────────────────────────────────────────────────────────
      // PER-ROUTE META CONFIGURATION
      // Rules applied here:
      //   • No fleet-size numbers (no "1–10 trucks", "small fleets")
      //   • No "back office" language
      //   • US listed before Canada everywhere
      //   • "compliance technology" / "automated" replaces service-bureau framing
      //   • No roadmap or mechanism language — outcomes and confidence only
      // ─────────────────────────────────────────────────────────────
      const metaData = {
        "/": {
          title: "TruckEase | Trucking Compliance Technology for US & Canadian Carriers",
          desc: "TruckEase gives carriers the compliance infrastructure that large fleets take for granted — automated, auditable, and always current. Serving the US and Canada."
        },
        "/platform": {
          title: "Compliance Platform for Carriers | TruckEase",
          desc: "One dashboard for DOT authority status, document storage, renewal alerts, and driver records. Built to catch what manual processes miss."
        },
        "/services": {
          title: "Trucking Compliance Services — IFTA, IRP, DOT, Driver Files | TruckEase",
          desc: "Managed IFTA filing, IRP registration, driver qualification files, and authority maintenance for carriers across the US and Canada."
        },
        "/about": {
          title: "About TruckEase | Compliance Technology Built for Carriers",
          desc: "TruckEase exists because compliance doesn't get easier just because you don't have a compliance department. We close that gap — with technology."
        },
        "/contact": {
          title: "Contact TruckEase | Speak Directly with Compliance Specialists",
          desc: "Questions about IFTA, DOT filings, CVOR, or cross-border compliance? Reach TruckEase directly. We respond within 1 business day.",
          faq: {
            "@context": "https://schema.org",
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What types of carriers does TruckEase work with?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "TruckEase works with carriers of all sizes that need reliable compliance infrastructure — from independent owner-operators to growing fleets. If you're managing compliance without a dedicated department, we're built for you."
                }
              },
              {
                "@type": "Question",
                "name": "Do your services cover both the US and Canada?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. We handle compliance across FMCSA (DOT, MC authority) and Canadian provincial frameworks including NSC and CVOR, including cross-border requirements like IFTA and IRP."
                }
              },
              {
                "@type": "Question",
                "name": "How quickly do you respond to inquiries?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Every message is reviewed personally. You'll hear back within 1 business day."
                }
              }
            ]
          }
        },
        "/free-review": {
          title: "Free Compliance Review for Carriers | TruckEase",
          desc: "Get a free review of your DOT, MC, NSC, or CVOR profile. We check your authority status, filing currency, and safety score — no commitment required."
        },
        "/blog": {
          title: "Trucking Compliance Guides & Resources | TruckEase Blog",
          desc: "Plain-language guides on IFTA, DOT compliance, driver qualification, and fleet record-keeping — written for carriers who run operations without a compliance department."
        }
      };

      function updatePageMeta() {
        const path = window.location.pathname;
        const data = metaData[path] || metaData["/"];

        // Title
        document.title = data.title;

        // Standard description
        const descMeta = document.getElementById("meta-description");
        if (descMeta) descMeta.setAttribute("content", data.desc);

        // Canonical
        const canonicalLink = document.getElementById("canonical-link");
        if (canonicalLink) {
          canonicalLink.setAttribute("href", "https://truckeasesolutions.com" + path);
        }

        // FAQ schema (contact page only)
        const faqScript = document.getElementById("faq-schema");
        if (faqScript) {
          faqScript.textContent = data.faq ? JSON.stringify(data.faq) : "";
        }

        // Inject blog link into footer if missing
        injectBlogLink();
      }

      function injectBlogLink() {
        setTimeout(() => {
          if (document.getElementById("dynamic-blog-link")) return;

          const footerLinks = document.querySelectorAll("footer a");
          let contactLink = null;
          for (const link of footerLinks) {
            if (link.textContent.trim() === "Contact") {
              contactLink = link;
              break;
            }
          }

          if (contactLink && contactLink.parentNode) {
            const blogLink = document.createElement("a");
            blogLink.id = "dynamic-blog-link";
            blogLink.href = "/blog";
            blogLink.className = "text-slate-400 hover:text-white transition text-sm block mt-2";
            blogLink.innerText = "Blog";
            contactLink.parentNode.insertBefore(blogLink, contactLink.nextSibling);
          }
        }, 400);
      }

      // SPA route change detection
      let currentPath = window.location.pathname;
      updatePageMeta();

      setInterval(() => {
        if (currentPath !== window.location.pathname) {
          currentPath = window.location.pathname;
          window.scrollTo(0, 0);
          updatePageMeta();
        }
      }, 100);
    </script>
  </body>
</html>
