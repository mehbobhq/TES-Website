<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <script>
        // Force the static server fallback to pass routing control back to your frontend
        window.history.replaceState(null, null, window.location.pathname + window.location.search);
    </script>
</head>
<body>
    <script>
        // Immediately fetch and render the main application layout
        fetch('/index.html')
            .html()
            .then(html => {
                document.open();
                document.write(html);
                document.close();
            });
    </script>
</body>
</html>
