<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
</head>
<body>
    <div id="root"></div>
    <script>
        // Smoothly fetch and inject the main application script bundle
        fetch('/index.html')
            .then(response => response.text())
            .then(html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                // Transfer head scripts and styles dynamically
                Array.from(doc.head.childNodes).forEach(node => {
                    if (node.nodeName === 'SCRIPT' || node.nodeName === 'LINK') {
                        const newNode = document.createElement(node.nodeName);
                        Array.from(node.attributes).forEach(attr => newNode.setAttribute(attr.name, attr.value));
                        if (node.innerHTML) newNode.innerHTML = node.innerHTML;
                        document.head.appendChild(newNode);
                    }
                });

                // Sync body container
                const newRoot = doc.getElementById('root');
                if (newRoot && document.getElementById('root')) {
                    document.getElementById('root').innerHTML = newRoot.innerHTML;
                }
                
                // Execute main JS payload entry point
                Array.from(doc.body.querySelectorAll('script')).forEach(oldScript => {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    if (oldScript.innerHTML) newScript.innerHTML = oldScript.innerHTML;
                    document.body.appendChild(newScript);
                });
            })
            .catch(err => console.error('Routing Fallback Error:', err));
    </script>
</body>
</html>
